<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo library, Abdur Rahman Tutul</title>
    <meta
      name="description"
      content="Eighteen self-initiated landing pages and portfolio layouts, designed and coded by Abdur Rahman Tutul. Every one is live."
    />
    <meta property="og:title" content="Demo library, Abdur Rahman Tutul" />
    <meta
      property="og:description"
      content="18 self-initiated pages, hand-coded. Every card opens the real thing."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tutul-abdurrahman.github.io/demos.html" />
    <meta property="og:image" content="https://tutul-abdurrahman.github.io/assets/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#06090a" />
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var saved = localStorage.getItem("tutul-theme");
          var theme = q === "light" || q === "dark" ? q : saved === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m && theme === "light") m.setAttribute("content", "#f1f2e8");
        } catch (e) {}
      })();
    </script>
